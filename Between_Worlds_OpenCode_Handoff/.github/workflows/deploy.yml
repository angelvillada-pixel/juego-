name: Deploy

# Despliegue manual a producción (P3-P5). Requiere estos secrets en el repo:
#   VPS_HOST  (IP o dominio del VPS)
#   VPS_USER  (usuario ssh, p.ej. ubuntu)
#   VPS_SSH_KEY (clave privada con acceso)
# Flujo: build de la imagen game -> push a GHCR -> ssh al VPS ->
# compose pull/up con el Caddyfile del repo. La CI de verify corre antes.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de partida"
        default: "frontline"
        required: true
      map:
        description: "Mapa"
        default: "lab"
        required: true

jobs:
  verify:
    uses: ./.github/workflows/ci.yml@master
    secrets: inherit

  build-and-push:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push game
        uses: docker/build-push-action@v6
        with:
          context: Between_Worlds_OpenCode_Handoff
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bw-game:${{ github.sha }}

  redeploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - name: Redeploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /opt/bw
            git pull --ff-only
            echo "BW_IMAGE=ghcr.io/${{ github.repository_owner }}/bw-game:${{ github.sha }}" > deploy/.env.image
            { cat deploy/.env; echo; cat deploy/.env.image; } > deploy/.env.deploy
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env.deploy up -d game
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env.deploy ps
