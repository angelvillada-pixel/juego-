name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot

      - name: Launch check (headless)
        run: /tmp/godot --headless --path . --quit

      - name: Unit tests
        run: /tmp/godot --headless --path . -s res://tests/run_tests.gd
